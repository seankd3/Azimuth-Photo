plugins {
    id 'com.android.application'
}

android {
    namespace 'app.photoarchive.mobile'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'app.photoarchive.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        def defaultServerUrl = providers
                .gradleProperty('photoArchiveDefaultServerUrl')
                .orElse(providers.environmentVariable('PHOTOARCHIVE_ANDROID_SERVER_URL'))
                .orElse('http://omarchy.tail0eeded.ts.net:8000')
                .get()
        buildConfigField 'String', 'DEFAULT_SERVER_URL', "\"${defaultServerUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}
