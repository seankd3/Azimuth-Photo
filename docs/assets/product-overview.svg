<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic Azimuth Photo product preview</title>
  <desc id="desc">A synthetic interface mockup showing Catalog, Library, Compare, and People surfaces with placeholder image tiles.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="0.48" stop-color="#eef3f0"/>
      <stop offset="1" stop-color="#e7edf7"/>
    </linearGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c25f4a"/>
      <stop offset="1" stop-color="#f0c36b"/>
    </linearGradient>
    <linearGradient id="tileB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#376f81"/>
      <stop offset="1" stop-color="#98c5b6"/>
