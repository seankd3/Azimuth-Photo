      .small { font: 500 13px Arial, sans-serif; fill: #5b6678; }
      .tiny { font: 600 11px Arial, sans-serif; fill: #6c7483; letter-spacing: 0; }
      .white { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #d8dee7; stroke-width: 1; }
      .line { stroke: #d8dee7; stroke-width: 1; }
    </style>
  </defs>

