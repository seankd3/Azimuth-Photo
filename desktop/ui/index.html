<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azimuth Photo</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0d0f12;
    color: #e8eaed;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  .wrap { text-align: center; }
  .mark {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  .mark span { color: #8ab4f8; }
  .spinner {
    width: 26px; height: 26px;
    margin: 0 auto 18px;
    border: 2.5px solid rgba(232, 234, 237, 0.15);
    border-top-color: #8ab4f8;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { color: #9aa0a6; font-size: 13.5px; max-width: 420px; margin: 0 auto; }
  .status.error { color: #f28b82; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">photo<span>Archive</span></div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Starting the local library…</div>
  </div>
  <script>
    // Called from the Rust shell while the satellite server comes up.
    window.__paStatus = function (message, isError) {
      var status = document.getElementById('status');
      status.textContent = message;
      status.classList.toggle('error', !!isError);
      document.getElementById('spinner').style.display = isError ? 'none' : '';
    };
  </script>
</body>
</html>
