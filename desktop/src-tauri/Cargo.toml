[package]
name = "photoarchive-desktop"
version = "0.1.0"
description = "Azimuth Photo desktop shell"
authors = ["Sean Kenneth Doherty"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
open = "5"
# Plain-HTTP client for the local server (readiness poll + sync status); no TLS needed.
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
