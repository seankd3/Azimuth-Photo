# photoArchive — example compose for a home NAS or always-on host.
#
# 1. Point ./photos (or a host path) at your originals folder.
# 2. ./data keeps the catalog, previews, and settings.
# 3. Open http://<host>:8000
#
# mDNS discovery needs host networking (see docs/INSTALL.md). This bridge
# mode is the simple default for a single machine on your LAN / Tailscale.

services:
  photoarchive:
    build: .
    image: photoarchive:latest
    container_name: photoarchive
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PHOTOARCHIVE_HOST: "0.0.0.0"
      PHOTOARCHIVE_PORT: "8000"
      PHOTOARCHIVE_HOME: "/data"
      PHOTOARCHIVE_MODE: "hub"
    volumes:
      # Your photo originals (read-write so imports / trash can work).
      - ./photos:/photos
      # Catalog database, caches, settings.
      - ./data:/data
    # Uncomment for LAN mDNS (_photoarchive._tcp) discovery from other devices:
    # network_mode: host
    # # When using host networking, drop the ports: block above.
