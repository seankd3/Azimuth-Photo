name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # The product ships on Windows; cloud sessions work on Linux. One check, both.
    name: azimuth-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python -m venv web/.venv
      - if: runner.os == 'Windows'
        run: web/.venv/Scripts/python.exe -m pip install -r web/requirements-v2.txt -r web/requirements-dev.txt
      - if: runner.os != 'Windows'
        run: web/.venv/bin/python -m pip install -r web/requirements-v2.txt -r web/requirements-dev.txt
      - run: bash scripts/azimuth-check
