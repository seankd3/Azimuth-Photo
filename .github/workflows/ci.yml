name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r web/requirements.txt
      - run: python -m pip install pytest
      # rclone lets the real local-remote sync acceptance run instead of
      # silently skipping the only test that proves backup bytes round-trip.
      - run: sudo apt-get update && sudo apt-get install -y rclone
      # -rs: skips are part of the result — silent non-execution is how the
      # browser and capability suites went unexercised unnoticed.
      - run: cd web && AZIMUTH_SMOKE_MODE=1 python -m pytest -q -rs

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser modules
        run: |
          while IFS= read -r js_file; do
            node --check "$js_file"
          done < <(rg --files web/static -g '*.js')
