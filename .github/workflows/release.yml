name: Release Azimuth Photo

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/azimuth-photo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/azimuth-photo:latest

  server:
    name: Build frozen server and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the V2 engine build dependencies
        run: python -m pip install -r web/requirements-v2.txt
      - name: Build the Linux onedir server
        run: python scripts/build_server.py
      - name: Package the server artifact
        # -C only rebases the input operand; the -f path is relative to the workspace.
        run: tar -C dist -czf "dist/azimuth-photo-server-${GITHUB_REF_NAME}.tar.gz" azimuth-server
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # GitHub compares this tag to the previous release tag and writes the commit notes.
          generate_release_notes: true
          files: dist/azimuth-photo-server-*.tar.gz
          fail_on_unmatched_files: true

  # STUB: Enable once desktop signing is ready. This Windows job will build the
  # Tauri NSIS installer, sign its updater bundle, and upload the installer plus
  # latest.json to this release. It needs TAURI_SIGNING_PRIVATE_KEY and
  # TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets; neither is created or
  # stored by this repository.
  signed-windows-desktop:
    if: ${{ false }}
    name: Signed Windows desktop installer (future)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reserved for the signed Tauri build
        run: echo "Configure Tauri signing secrets before enabling this job."
