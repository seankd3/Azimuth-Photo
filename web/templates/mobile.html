<!DOCTYPE html>
<html lang="en" data-static-version="{{ static_version }}" data-https-port="8443">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#141517">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Azimuth Photo</title>
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icons/icon.svg">
    <link rel="stylesheet" href="/static/mobile.css?v={{ static_version }}">
    {% for mod in module_preloads | default([]) %}<link rel="modulepreload" href="/static/js/{{ mod }}?v={{ static_version }}">
    {% endfor %}</head>
<body data-tab="photos">
    <div id="m-offline" hidden>Offline — changes need a connection</div>

    <main id="m-tabs">
        <section id="tab-photos" class="m-tab active">
            <div id="m-timeline"></div>
            <div id="m-sentinel"></div>
            <div id="m-end" hidden>End of scope</div>
        </section>
        <section id="tab-search" class="m-tab"><div id="m-search"></div></section>
        <section id="tab-refine" class="m-tab"><div id="m-refine"></div></section>
        <section id="tab-library" class="m-tab"><div id="m-library"></div></section>
    </main>

    <!-- Photos-tab chrome -->
    <div id="m-monthpill" aria-hidden="true"></div>
    <button id="m-zoomctl" aria-label="Change grid zoom level"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-layout-grid"></use></svg></button>
    <button id="m-photo-options" aria-label="Photo sort and stack options"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-sliders-horizontal"></use></svg></button>
    <div id="m-scopebar"></div>
    <div id="m-scrub"><div class="ms-handle"><svg class="icon" aria-hidden="true"><use href="#i-grip"></use></svg></div></div>
    <div id="scrub-bubble"></div>

    <!-- bottom sheet (collections picker, info, menus) -->
    <div id="m-sheet-scrim" hidden></div>
    <div id="m-sheet" role="dialog" aria-modal="true" hidden></div>

    <!-- viewer -->
    <div id="m-viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <div id="mv-stage">
            <img id="mv-img" alt="" fetchpriority="high" decoding="async">
            <div id="mv-cap"></div>
            <button id="mv-close" aria-label="Close viewer"><svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg></button>
        </div>
        <div id="mv-bar">
            <button id="mv-pick" aria-label="Favorite" aria-pressed="false"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-heart"></use></svg></button>
            <button id="mv-reject" aria-label="Reject"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-x"></use></svg></button>
            <button id="mv-coll" aria-label="Add to collection"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-plus"></use></svg></button>
            <button id="mv-offline" aria-label="Make available offline" aria-pressed="false"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-download"></use></svg></button>
            <button id="mv-share" aria-label="Share photo"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-share-2"></use></svg></button>
            <button id="mv-info" aria-label="Photo info"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-info"></use></svg></button>
        </div>
    </div>

    <!-- undo-first toast -->
    <div id="m-toast" role="status" aria-live="polite">
        <span class="t-msg" id="m-toast-msg"></span>
        <button class="t-undo" id="m-toast-undo">Undo</button>
    </div>

    <nav id="m-tabbar">
        <button data-tab="photos" class="active"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-layout-grid"></use></svg>Photos</button>
        <button data-tab="search"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-search"></use></svg>Search</button>
        <button data-tab="refine"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-zap"></use></svg>Refine</button>
        <button data-tab="library"><svg class="icon icon-lg" aria-hidden="true"><use href="#i-folder"></use></svg>Library</button>
    </nav>

    <a id="m-dl" download hidden></a>

    <script>
        // Service workers require a secure context (HTTPS / localhost).
        // On plain HTTP this is a no-op — the localStorage write queue still works.
        // Version the SW URL with the same cache-bust stamp as CSS/JS so updates
        // replace the shell cache (see docs/FIELD_HTTPS.md).
        if ('serviceWorker' in navigator && window.isSecureContext) {
            window.addEventListener('load', function () {
                var version = document.documentElement.getAttribute('data-static-version') || '';
                var url = version
                    ? '/sw.js?v=' + encodeURIComponent(version)
                    : '/sw.js';
                navigator.serviceWorker.register(url).catch(function () {});
            });
        }
    </script>
    <script type="module" src="/static/js/mobile/bootstrap.js?v={{ static_version }}"></script>
</body>
</html>
