<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#141517">
  <meta name="robots" content="noindex">
  <title>Azimuth Photo — Unlock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141517;
      --text: #e8e8e6;
      --muted: #9a9a97;
      --line: rgba(232, 232, 230, .12);
      --accent: #7aa8d4;
      --danger: #e19393;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .shell { width: min(1420px, 100%); margin: 0 auto; }
    .sub { color: var(--muted); font-size: 14px; line-height: 1.45; margin-top: 8px; }
    .locked-wrap { min-height: calc(100vh - 72px); display: grid; place-items: center; }
    .lock-card { width: min(360px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.035); box-shadow: 0 24px 64px rgba(0,0,0,.28); text-align: center; }
    .lock-glyph { width: 44px; height: 44px; margin: 0 auto 16px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent); font-size: 19px; }
    .lock-card h1 { margin: 0; font-size: 24px; line-height: 1.1; font-weight: 680; overflow-wrap: anywhere; }
    .lock-card .sub { margin-bottom: 20px; }
    .unlock-form { display: grid; gap: 10px; }
    .unlock-form input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 6px; background: #0f1012; color: var(--text); font: inherit; font-size: 16px; outline: 0; padding: 0 12px; }
    .unlock-form input:focus { border-color: var(--accent); }
    .unlock-form button { height: 46px; border: 0; border-radius: 6px; background: var(--accent); color: #0d1114; font: inherit; font-weight: 680; cursor: pointer; }
    .unlock-error { min-height: 19px; margin: 0; color: var(--danger); font-size: 13px; }
  </style>
</head>
<body>
  <div class="shell">
    <section class="locked-wrap">
      <div class="lock-card">
        <div class="lock-glyph" aria-hidden="true">&#128274;</div>
        <h1>Azimuth Photo</h1>
        <div class="sub">Enter your owner key to open this library.</div>
        <form class="unlock-form" method="post" action="/api/auth/unlock?next={{ next_target | urlencode }}">
          <input name="password" type="password" placeholder="Owner key" autocomplete="current-password" autofocus required>
          <button type="submit">Unlock</button>
          <p class="unlock-error">
            {% if throttle_seconds %}Too many tries. Please wait about {{ throttle_minutes }} minute{% if throttle_minutes != 1 %}s{% endif %} and try again.
            {% elif unlock_error %}That key did not unlock this library.{% endif %}
          </p>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
