[pytest]
# No waiting. A test needing more than ten seconds is testing the wrong thing,
# and a stuck one costs more than it protects.
timeout = 10
timeout_method = thread
# The policy below is mechanical: a timing test runs only when asked for
# (`-m bench`), never in the default run, where a loaded machine made a
# 200 ms budget fail twice in one night.
addopts = -m "not bench"
markers =
    bench: opt-in timing, never part of the default run
