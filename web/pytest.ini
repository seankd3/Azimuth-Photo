[pytest]
addopts = -m "not bench"
markers =
    perf: standing performance budget checks that run in the default suite
    bench: end-to-end standing benchmark gate; opt in with -m bench
    contract: closed-class product guards (tier 0; seconds)
    slow: e2e / Playwright / long wall-clock; excluded from gate quick
    serial: must not share an xdist worker wave; run after parallel pass
    playwright: browser-driven e2e proofs
