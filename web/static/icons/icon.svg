<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Azimuth Photo mark: photo stack behind an aperture iris -->
    <rect width="512" height="512" rx="112" fill="#141517"/>
    <!-- back card of the stack -->
    <rect x="140" y="112" width="232" height="232" rx="26"
          fill="none" stroke="#33383e" stroke-width="14"
          transform="rotate(-7 256 228)"/>
    <!-- front card -->
    <rect x="140" y="162" width="232" height="232" rx="26"
          fill="#1a1c1f" stroke="#7aa8d4" stroke-width="14"/>
    <!-- aperture iris: six chords around the ring -->
    <g stroke="#7aa8d4" stroke-width="13" stroke-linecap="round" fill="none">
        <circle cx="256" cy="278" r="72"/>
        <line x1="328.0" y1="278.0" x2="200.8" y2="324.3"/>
        <line x1="292.0" y1="340.4" x2="188.3" y2="253.4"/>
        <line x1="220.0" y1="340.4" x2="243.5" y2="207.1"/>
        <line x1="184.0" y1="278.0" x2="311.2" y2="231.7"/>
        <line x1="220.0" y1="215.7" x2="323.7" y2="302.6"/>
        <line x1="292.0" y1="215.7" x2="268.5" y2="348.9"/>
    </g>
</svg>
