<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#141517">
  <meta property="og:title" content="Queued gallery">
  <meta property="og:description" content="A photo gallery from seankennethdoherty.com">
  <meta property="og:image" content="https://www.seankennethdoherty.com/g/queued-gallery/img/1.jpg">
  <meta property="og:site_name" content="seankennethdoherty.com">
  <title>Queued gallery</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141517;
      --photo-bg: #000;
      --text: #e8e8e6;
      --muted: #9a9a97;
      --line: rgba(232, 232, 230, .12);
      --accent: #7aa8d4;
      --accent-soft: rgba(122, 168, 212, .13);
      --danger: #e19393;
      --row: 220px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .shell { width: min(1420px, 100%); margin: 0 auto; }
    .tree-back { display: inline-block; margin: 0 0 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
    .child-strip { display: flex; gap: 10px; overflow-x: auto; padding: 16px 0 2px; }
    .child-card { flex: 0 0 180px; color: var(--text); text-decoration: none; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .child-card img { display: block; width: 100%; aspect-ratio: 1.6; object-fit: cover; background: var(--photo-bg); }
    .child-card span { display: block; padding: 9px; font-size: 13px; }
    .cover-hero { position: relative; min-height: min(52vw, 520px); margin-bottom: 20px; display: grid; align-items: end; overflow: hidden; background: var(--photo-bg); }
    .cover-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .cover-hero::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.82)); }
    .cover-copy { position: relative; z-index: 1; padding: clamp(18px, 4vw, 42px); }
    .cover-copy .brand-line { margin-bottom: 10px; }
    header { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding: 4px 0 18px; border-bottom: 1px solid var(--line); }
    .brand-line { margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; color: var(--muted); font-size: 13px; }
    .brand-name { color: var(--text); font-weight: 650; }
    .brand-line a, footer a { color: var(--accent); text-decoration: none; }
    .brand-line a:hover, footer a:hover { text-decoration: underline; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 46px); line-height: 1; font-weight: 680; letter-spacing: 0; }
    .sub, .count, .empty p { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .sub { margin-top: 8px; }
    .count { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .header-stats { display: grid; gap: 5px; justify-items: end; }
    .pick-count { color: var(--accent); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; justify-content: end; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .action-btn, .done-btn, .download-btn { min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.045); color: var(--text); font: inherit; font-size: 13px; text-decoration: none; display: inline-grid; place-items: center; cursor: pointer; padding: 0 12px; }
    .action-btn:hover, .done-btn:hover, .download-btn:hover { background: rgba(255,255,255,.08); }
    .action-btn:focus-visible, .done-btn:focus-visible, .download-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .download-note, .pick-status { color: var(--muted); font-size: 13px; line-height: 1.4; }
    .client-panel { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .done-btn { color: #0d1114; background: var(--accent); border-color: transparent; font-weight: 680; }
    .done-btn:disabled { cursor: default; opacity: .52; }
    .hint-chip { position: absolute; right: 0; bottom: -15px; z-index: 3; border: 1px solid var(--line); border-radius: 999px; background: #202225; color: var(--text); box-shadow: 0 10px 24px rgba(0,0,0,.22); padding: 6px 10px; font-size: 12px; line-height: 1; transition: opacity .16s ease, transform .16s ease; }
    .hint-chip[hidden] { display: none; }
    .grid { display: flex; flex-wrap: wrap; gap: 5px; padding-top: 18px; }
    .tile { position: relative; flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); height: var(--row); min-width: 86px; background: var(--photo-bg); overflow: hidden; cursor: zoom-in; }
    .grid::after { content: ""; flex-grow: 999999; min-width: 10%; }
    .tile img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.015); transition: opacity .22s ease, transform .22s ease; }
    .tile img.loaded { opacity: 1; transform: scale(1); }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; z-index: 2; }
    .fav-btn { width: 44px; height: 44px; border: 0; border-radius: 999px; background: rgba(10,11,13,.48); color: rgba(255,255,255,.82); display: grid; place-items: center; cursor: pointer; font: inherit; font-size: 24px; line-height: 1; text-shadow: 0 1px 8px rgba(0,0,0,.45); transition: opacity .16s ease, background .16s ease, color .16s ease, transform .16s ease; }
    .fav-btn:hover { background: rgba(10,11,13,.72); transform: scale(1.04); }
    .fav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fav-btn.on { color: var(--accent); opacity: 1; }
    .tile-fav { position: absolute; top: 6px; right: 6px; opacity: .68; }
    .tile-download { position: absolute; right: 6px; bottom: 6px; width: 40px; min-width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 999px; background: rgba(10,11,13,.54); opacity: .72; font-size: 19px; line-height: 1; }
    @media (hover: hover) and (pointer: fine) {
      .tile-fav, .tile-download { opacity: 0; }
      .tile:hover .tile-fav, .tile:focus-within .tile-fav, .tile-fav.on, .tile:hover .tile-download, .tile:focus-within .tile-download { opacity: 1; }
    }
    .empty { min-height: 58vh; display: grid; place-items: center; text-align: center; }
    .empty h1 { font-size: clamp(28px, 6vw, 54px); }
    .locked-wrap { min-height: calc(100vh - 72px); display: grid; place-items: center; }
    .lock-card { width: min(360px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.035); box-shadow: 0 24px 64px rgba(0,0,0,.28); text-align: center; }
    .lock-glyph { width: 44px; height: 44px; margin: 0 auto 16px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent); font-size: 19px; }
    .lock-card h1 { font-size: 24px; line-height: 1.1; overflow-wrap: anywhere; }
    .lock-card .sub { margin-bottom: 20px; }
    .unlock-form { display: grid; gap: 10px; }
    .unlock-form input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 6px; background: #0f1012; color: var(--text); font: inherit; font-size: 16px; outline: 0; padding: 0 12px; }
    .unlock-form input:focus { border-color: var(--accent); }
    .unlock-form button { height: 46px; border: 0; border-radius: 6px; background: var(--accent); color: #0d1114; font: inherit; font-weight: 680; cursor: pointer; }
    .unlock-error { min-height: 19px; margin: 0; color: var(--danger); font-size: 13px; }
    footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .lightbox[hidden] { display: none; }
    .lightbox { position: fixed; inset: 0; z-index: 20; background: #000; display: grid; grid-template-rows: auto 1fr auto; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    .lb-bar { height: 48px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .lb-bar a, .lb-bar button { min-width: 44px; min-height: 44px; color: var(--text); border: 0; background: transparent; font: inherit; text-decoration: none; display: grid; place-items: center; border-radius: 6px; }
    .lb-bar a { margin-left: auto; padding: 0 12px; color: var(--accent); }
    .lb-bar button:hover, .lb-bar a:hover { background: rgba(255,255,255,.08); }
    .lb-bar .fav-btn { background: transparent; color: var(--text); font-size: 25px; }
    .lb-bar .fav-btn.on { color: var(--accent); }
    .stage { min-height: 0; display: grid; place-items: center; overflow: hidden; touch-action: none; }
    .stage img { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; transition: opacity .18s ease, transform .12s ease; transform: translate(var(--pan-x, 0px), var(--pan-y, 0px)) scale(var(--zoom, 1)); }
    .stage img.loaded { opacity: 1; }
    .caption { min-height: 34px; color: var(--muted); font-size: 13px; display: flex; align-items: center; justify-content: center; text-align: center; overflow-wrap: anywhere; }
    .nav { position: fixed; top: 50%; width: 52px; height: 72px; margin-top: -36px; border: 0; border-radius: 6px; background: rgba(255,255,255,.06); color: var(--text); font-size: 34px; display: grid; place-items: center; }
    .nav:hover { background: rgba(255,255,255,.12); }
    .prev { left: max(12px, env(safe-area-inset-left)); }
    .next { right: max(12px, env(safe-area-inset-right)); }
    @media (max-width: 720px) {
      body { padding-top: max(18px, env(safe-area-inset-top)); }
      header { grid-template-columns: 1fr; align-items: start; gap: 10px; padding-bottom: 16px; }
      .header-stats { justify-items: start; width: 100%; }
      .header-actions { justify-content: start; }
      .client-panel { align-items: stretch; flex-direction: column; }
      .done-btn { width: 100%; }
      .hint-chip { left: 0; right: auto; bottom: -17px; }
      .grid { gap: 3px; }
      .tile { --row: 118px; flex-basis: calc(var(--ar) * var(--row)); min-width: 31%; }
      .nav { display: none; }
      .lb-bar { height: 52px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    
      
      
      <header>
        <div>
          
          <div class="brand-line">
            <span>From</span>
            <span class="brand-name">seankennethdoherty.com</span>
            <a href="https://www.seankennethdoherty.com" target="_blank" rel="noopener noreferrer">seankennethdoherty.com</a>
          </div>
          
          <h1>Queued gallery</h1>
          
        </div>
        <div class="header-stats">
          <div class="count">1 photo</div>
          <div class="download-note" id="download-note">Downloads use the gallery-ready files.</div>
          
          
        </div>
        
      </header>
      
      
      <section class="grid" id="grid" aria-label="Queued gallery photos"></section>
      <footer>
        <span>seankennethdoherty.com</span>
        <a href="https://www.seankennethdoherty.com" target="_blank" rel="noopener noreferrer">seankennethdoherty.com</a>
      </footer>
    
  </main>
  
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-bar">
      <button id="close" type="button" aria-label="Close">×</button>
      <span id="counter"></span>
      
      <a id="full" href="#" rel="noopener noreferrer" download>Download photo</a>
    </div>
    <button class="nav prev" id="prev" type="button" aria-label="Previous">‹</button>
    <div class="stage"><img id="stage-img" alt=""></div>
    <button class="nav next" id="next" type="button" aria-label="Next">›</button>
    <div class="caption" id="caption"></div>
  </div>
  <script type="application/json" id="gallery-data">{"brand": {"name": "seankennethdoherty.com", "site_label": "seankennethdoherty.com", "site_url": "https://www.seankennethdoherty.com"}, "date_range": "", "download_size_label": "gallery-size copy", "images": [{"aspect_ratio": 1.5, "date_taken": null, "display_label": "Photo 1 of 1", "download": "./lg/1.jpg", "download_name": "queued.jpg", "filename": "queued.jpg", "full": "./lg/1.jpg", "id": 1, "preview": "./img/1.jpg", "thumb": "./thumb/sm/1.jpg"}], "name": "Queued gallery", "photo_count": 1, "token": "public-queued-gallery"}</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('gallery-data').textContent || '{}');
      const images = Array.isArray(data.images) ? data.images : [];
      const grid = document.getElementById('grid');
      const lightbox = document.getElementById('lightbox');
      const stageImg = document.getElementById('stage-img');
      const stage = document.querySelector('.stage');
      const counter = document.getElementById('counter');
      const caption = document.getElementById('caption');
      const full = document.getElementById('full');
      const pickCount = document.getElementById('pick-count');
      const pickStatus = document.getElementById('pick-status');
      const picksDone = document.getElementById('picks-done');
      const hint = document.getElementById('fav-hint');
      const lightboxFav = document.getElementById('lb-fav');
      const downloadAll = document.getElementById('download-all');
      const downloadNote = document.getElementById('download-note');
      const favoritesEnabled = false;
      const token = String(data.token || '');
      const favoriteKey = `pa_fav_${token}`;
      const hintKey = `pa_fav_hint_${token}`;
      const doneKey = `pa_fav_done_${token}`;
      let favorites = readFavorites();
      let favoritesDone = readFavoritesDone();
      let index = 0;
      let touchStart = null;
      let zoom = 1;
      let pan = { x: 0, y: 0 };
      const pointers = new Map();
      let pinchStart = null;

      function renderGrid() {
        if (!grid) return;
        if (!images.length) {
          grid.innerHTML = '<section class="empty"><div><h1>No photos yet</h1><p>This gallery is ready, but it does not include any photos.</p></div></section>';
          return;
        }
        grid.innerHTML = images.map((image, i) => (
          `<div class="tile" role="button" tabindex="0" style="--ar:${Math.max(.45, Math.min(2.4, Number(image.aspect_ratio) || 1.5))}" data-i="${i}" aria-label="${escapeHtml(photoLabel(image, i))}">`
          + `<img loading="lazy" decoding="async" src="${image.thumb}" alt="">`
          + (favoritesEnabled ? `<button class="fav-btn tile-fav${favorites.has(Number(image.id)) ? ' on' : ''}" type="button" data-fav-id="${image.id}" aria-label="Pick favorite" aria-pressed="${favorites.has(Number(image.id)) ? 'true' : 'false'}">${favorites.has(Number(image.id)) ? '♥' : '♡'}</button>` : '')
          + `<a class="download-btn tile-download" href="${escapeHtml(image.download || image.full || '#')}" download="${escapeHtml(image.download_name || '')}" aria-label="Download ${escapeHtml(photoLabel(image, i))}" title="Download">↓</a>`
          + '</div>'
        )).join('');
        grid.querySelectorAll('img').forEach((img) => {
          if (img.complete) img.classList.add('loaded');
          img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
        });
        grid.addEventListener('click', (event) => {
          const favButton = event.target.closest('[data-fav-id]');
          if (favButton) {
            event.preventDefault();
            event.stopPropagation();
            toggleFavorite(Number(favButton.dataset.favId));
            return;
          }
          if (event.target.closest('.tile-download')) return;
          const tile = event.target.closest('.tile[data-i]');
          if (tile) openAt(Number(tile.dataset.i));
        });
        grid.addEventListener('keydown', (event) => {
          if (event.target.closest('[data-fav-id]')) return;
          if (event.key !== 'Enter' && event.key !== ' ') return;
          const tile = event.target.closest('.tile[data-i]');
          if (!tile) return;
          event.preventDefault();
          openAt(Number(tile.dataset.i));
        });
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
      }

      function photoLabel(image, fallbackIndex) {
        return image.display_label || `Photo ${fallbackIndex + 1} of ${images.length}`;
      }

      function openAt(nextIndex) {
        if (!images.length) return;
        index = (nextIndex + images.length) % images.length;
        const image = images[index];
        lightbox.hidden = false;
        stageImg.classList.remove('loaded');
        stageImg.alt = photoLabel(image, index);
        stageImg.src = image.preview;
        resetZoom();
        const fullImage = new Image();
        fullImage.onload = () => {
          if (!lightbox.hidden && images[index] === image) stageImg.src = image.full || image.preview;
        };
        fullImage.src = image.full || image.preview;
        counter.textContent = `${index + 1} / ${images.length}`;
        caption.textContent = photoLabel(image, index);
        full.href = image.download || image.full;
        full.setAttribute('download', image.download_name || '');
        syncFavoriteButtons();
        document.body.style.overflow = 'hidden';
        document.getElementById('close').focus({ preventScroll: true });
      }

      function close() {
        lightbox.hidden = true;
        stageImg.removeAttribute('src');
        document.body.style.overflow = '';
      }

      function applyZoom() {
        stageImg.style.setProperty('--zoom', zoom);
        stageImg.style.setProperty('--pan-x', `${pan.x}px`);
        stageImg.style.setProperty('--pan-y', `${pan.y}px`);
      }

      function resetZoom() {
        zoom = 1;
        pan = { x: 0, y: 0 };
        applyZoom();
      }

      function move(delta) {
        if (!lightbox.hidden) openAt(index + delta);
      }

      function readFavorites() {
        try {
          const stored = JSON.parse(localStorage.getItem(favoriteKey) || '[]');
          return new Set((Array.isArray(stored) ? stored : []).map(Number).filter((id) => id > 0));
        } catch {
          return new Set();
        }
      }

      function readFavoritesDone() {
        try {
          return localStorage.getItem(doneKey) === '1';
        } catch {
          return false;
        }
      }

      function writeFavorites() {
        try {
          localStorage.setItem(favoriteKey, JSON.stringify([...favorites]));
        } catch {
          // Local mirror is an instant-paint cache only.
        }
      }

      function writeFavoritesDone(done) {
        favoritesDone = Boolean(done);
        try {
          if (favoritesDone) localStorage.setItem(doneKey, '1');
          else localStorage.removeItem(doneKey);
        } catch {
          // Done state is only local confirmation chrome.
        }
      }

      function favoriteStatusText(picked) {
        const noun = picked === 1 ? 'favorite' : 'favorites';
        if (favoritesDone) return `Sent — your photographer has your ${picked} ${noun}.`;
        if (picked > 0) return `${picked} ${noun} saved — your photographer sees these.`;
        return 'Pick favorites as you browse.';
      }

      function hintDismissed() {
        try {
          return localStorage.getItem(hintKey) === '1';
        } catch {
          return true;
        }
      }

      function dismissHint() {
        if (hint) hint.hidden = true;
        try {
          localStorage.setItem(hintKey, '1');
        } catch {
          // Hint state is non-essential.
        }
      }

      function syncFavoriteButtons() {
        const picked = favorites.size;
        if (pickCount) pickCount.textContent = `${picked} picked`;
        if (pickStatus) pickStatus.textContent = favoriteStatusText(picked);
        if (picksDone) {
          picksDone.disabled = picked === 0;
          picksDone.textContent = 'Done';
        }
        if (hint) hint.hidden = picked > 0 || hintDismissed();
        document.querySelectorAll('[data-fav-id]').forEach((button) => {
          const on = favorites.has(Number(button.dataset.favId));
          button.classList.toggle('on', on);
          button.setAttribute('aria-pressed', on ? 'true' : 'false');
          button.textContent = on ? '♥' : '♡';
        });
        if (lightboxFav && images[index]) {
          const on = favorites.has(Number(images[index].id));
          lightboxFav.classList.toggle('on', on);
          lightboxFav.setAttribute('aria-pressed', on ? 'true' : 'false');
          lightboxFav.textContent = on ? '♥' : '♡';
        }
      }

      

      function downloadGallery() {
        if (!images.length) return;
        if (downloadNote) {
          downloadNote.textContent = `Starting ${images.length} photo download${images.length === 1 ? '' : 's'} at ${data.download_size_label || 'gallery size'}.`;
        }
        if (data.download_all_url) window.location.assign(data.download_all_url);
      }

      stageImg.addEventListener('load', () => stageImg.classList.add('loaded'));
      document.getElementById('close').addEventListener('click', close);
      document.getElementById('prev').addEventListener('click', () => move(-1));
      document.getElementById('next').addEventListener('click', () => move(1));
      downloadAll?.addEventListener('click', downloadGallery);
      
      document.addEventListener('keydown', (event) => {
        if (lightbox.hidden) return;
        if (event.key === 'Escape') close();
        if (event.key === 'ArrowLeft') move(-1);
        if (event.key === 'ArrowRight') move(1);
      });
      lightbox.addEventListener('touchstart', (event) => {
        const touch = event.changedTouches[0];
        touchStart = touch ? { x: touch.clientX, y: touch.clientY } : null;
      }, { passive: true });
      lightbox.addEventListener('touchend', (event) => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        touchStart = null;
        if (Math.abs(dy) > 80 && Math.abs(dy) > Math.abs(dx) * 1.2 && dy > 0) close();
        else if (zoom === 1 && Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy)) move(dx < 0 ? 1 : -1);
      }, { passive: true });
      stage?.addEventListener('pointerdown', (event) => {
        stage.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          pinchStart = { distance: Math.hypot(a.x - b.x, a.y - b.y), zoom };
        }
      });
      stage?.addEventListener('pointermove', (event) => {
        const previous = pointers.get(event.pointerId);
        if (!previous) return;
        const current = { x: event.clientX, y: event.clientY };
        pointers.set(event.pointerId, current);
        if (pointers.size === 2 && pinchStart) {
          const [a, b] = [...pointers.values()];
          zoom = Math.max(1, Math.min(4, pinchStart.zoom * Math.hypot(a.x - b.x, a.y - b.y) / pinchStart.distance));
        } else if (zoom > 1) {
          pan.x += current.x - previous.x;
          pan.y += current.y - previous.y;
        }
        applyZoom();
      });
      stage?.addEventListener('pointerup', (event) => {
        pointers.delete(event.pointerId);
        if (pointers.size < 2) pinchStart = null;
      });
      stage?.addEventListener('dblclick', () => {
        if (zoom === 1) zoom = 2;
        else resetZoom();
        applyZoom();
      });

      renderGrid();
      syncFavoriteButtons();
      if (favoritesEnabled) fetchFavorites();
    })();
  </script>
  
</body>
</html>
